[workspace]
members = [ 
  "core",
  "lowering",
  "ir",
  "synthesis",
  "ir-gen",
  "backend",
  "picus",
  "llzk",
  "driver",
  "support/midnight",
  "support/mdnt-test-circuits",
]
resolver = "2"

[workspace.package]
version = "0.5.15"
authors = ["Daniel Dominguez (Veridise) <daniel@veridise.com>"]
edition = "2024"
rust-version = "1.85"
readme = "README.md"
repository = "https://github.com/project-llzk/haloumi"
license-file = "LICENSE"
categories = ["compilers"]
keywords = ["halo2", "llzk", "haloumi"]

[workspace.dependencies]
ff = "0.13"
thiserror = "2.0"
internment = "0.8.6"
num-bigint = "0.4"
log = "0.4"
eqv = "0.1"
bit-set = "0.8"
disjoint = "0.8"
llzk = { version = "0.6.0", features =["bigint"] }

# Testing dependencies
halo2curves = "0.7.0"
similar-asserts = "1.7"
mlir-testutils = {version = "0.1.0", features = ["similar-asserts"]}

[patch.crates-io]
llzk = { git = "https://github.com/project-llzk/llzk-rs" }
