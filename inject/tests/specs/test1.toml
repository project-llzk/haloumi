[targets]
test1 = "0.5"

[dependencies.haloumi]
version = "*"
package = "haloumi-integration"

[[patch.append]]
path = "src/lib.rs"
content = "haloumi::__mock_impl!();"

[[patch.derive]]
path = "src/foo.rs"
type = "Foo"
trait = "Debug"

[patch.derive.attributes]
type = ["type_attr"]

[patch.derive.attributes.params]
"'a" = ["lifetime_attr"]
T = ["type_param_attr"]
N = ["const_param_attr"]

[patch.derive.attributes.fields]
a = ["field_attr"]

[[patch.derive]]
path = "src/foo.rs"
type = "Tuple"
trait = "Debug"

[patch.derive.attributes.fields]
"0" = ["tuple_field_attr"]

[[patch.derive]]
path = "src/foo.rs"
type = "Union"
trait = "Debug"

[patch.derive.attributes.fields]
value = ["union_field_attr"]

[[patch.derive]]
path = "src/bar.rs"
type = "Bar"
trait = "haloumi::MockTrait"

[patch.derive.attributes]
type = ["foo(123)", "#[bar = \"baz\"]"]

[patch.derive.attributes.variants.X]
attributes = ["variant_attr"]

[[patch.derive]]
path = "src/bar.rs"
type = "Fields"
trait = "Debug"

[patch.derive.attributes.variants.Tuple.fields]
"0" = ["tuple_variant_field_attr"]

[patch.derive.attributes.variants.Named.fields]
value = ["named_variant_field_attr"]

[[patch.attribute]]
path = "src/foo.rs"
target = "Foo::a"
attributes = ["standalone_attr"]
