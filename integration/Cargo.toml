[package]
name = "haloumi-integration"
description = "Helpers for integrating Haloumi with Halo2 implementations."
categories = {workspace = true}
version = {workspace = true}
authors = {workspace = true}
edition = {workspace = true}
rust-version = {workspace = true}
readme = "README.md"
repository = {workspace = true}
license-file = {workspace = true}
keywords = {workspace = true}

[dependencies]
ff.workspace = true
num-bigint.workspace = true
thiserror.workspace = true
num-traits = "0.2"
haloumi-core = { path = "../core" }
haloumi-ir = { path = "../ir" }
haloumi-ir-gen = { path = "../ir-gen" }
haloumi-synthesis = { path = "../synthesis" }
haloumi-integration-macros = { path = "../integration-macros" }
haloumi-extractor = { path = "../extractor/", optional = true }

anyhow = { version = "1", optional = true }
inventory = { version = "0.3", optional = true }

[dev-dependencies]
rstest = "0"

[features]
extractor = ["dep:anyhow", "dep:inventory", "dep:haloumi-extractor"]
