[package]
name = "haloumi-synthesis"
description = "Synthesis step of the haloumi lowering pipeline."
categories = {workspace = true}
version = {workspace = true}
authors = {workspace = true}
edition = {workspace = true}
rust-version = {workspace = true}
readme = "README.md"
repository = {workspace = true}
license-file = {workspace = true}
keywords = {workspace = true}

[dependencies]
ff.workspace = true
haloumi-core = { path = "../core", version = "0.5.5"}
thiserror.workspace = true
log.workspace = true
bit-set.workspace = true
serde = { workspace = true, optional = true }
quickcheck = { workspace = true, optional = true }

[dev-dependencies]
quickcheck.workspace = true
quickcheck_macros.workspace = true
serde_json.workspace = true
haloumi-core = { path = "../core", version = "0.5.5", features = ["arbitrary"] }

[features]
default = ["serde"]
serde = ["dep:serde", "haloumi-core/serde"]
arbitrary = ["dep:quickcheck", "haloumi-core/arbitrary"]
